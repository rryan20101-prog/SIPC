<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الممارس المعتمد في الابتكار الاجتماعي | SIPC</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#102b2a;--muted:#667774;--paper:#fff;--bg:#f4f7f6;--line:#dfe9e6;
  --brand:#123f3a;--brand2:#2d6f63;--green:#61bf45;--blue:#4c9fd1;--orange:#ed7d31;
  --red:#d94f45;--violet:#6750a4;--shadow:0 20px 60px rgba(18,63,58,.10)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{min-height:100vh}
.shell{max-width:1440px;margin:auto;padding:20px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.sipcBadge{width:60px;height:60px;border-radius:18px;background:linear-gradient(145deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:1000;box-shadow:0 12px 28px rgba(18,63,58,.20);letter-spacing:.5px}
.brandTitle{font-size:21px;font-weight:1000;line-height:1.25}
.brandSub{font-size:12px;color:var(--muted);margin-top:4px}
.brandlogos{display:flex;align-items:center;gap:9px;margin-inline-start:auto}
.brandlogos img{display:block;object-fit:contain;background:#fff;border:1px solid #edf2f0;border-radius:12px;padding:5px}
.brandlogos .areeb{width:70px;height:54px} .brandlogos .adp{width:112px;height:54px}
.btn{border:0;border-radius:15px;padding:12px 18px;font-weight:900;background:#edf3f1;color:var(--brand);transition:.18s}
.btn:hover{transform:translateY(-1px)} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brand);color:#fff} .btn.green{background:var(--green);color:#fff}
.btn.orange{background:var(--orange);color:#fff} .btn.red{background:var(--red);color:#fff}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:#eef5f2;color:var(--brand);padding:8px 12px;font-size:12px;font-weight:900}
.input{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:#fff;outline:none}
.input:focus{border-color:#88b7a8;box-shadow:0 0 0 4px #88b7a822}
.small{font-size:12px;color:var(--muted)}
.home{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:28px}
.homeInner{width:min(920px,100%)}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(34px,5vw,58px);margin:14px 0 8px;letter-spacing:-1.2px}
.hero p{margin:0;color:var(--muted);font-size:16px}
.roleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.roleCard{border:1px solid var(--line);border-radius:24px;padding:26px;background:#fff;transition:.2s;min-height:190px}
.roleCard:hover{transform:translateY(-3px);box-shadow:0 18px 45px rgba(18,63,58,.10)}
.roleIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#eef5f2;margin-bottom:28px}
.roleCard h3{font-size:24px;margin:0 0 7px} .roleCard p{margin:0 0 18px;color:var(--muted)}

/* Lobby */
.lobbyGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.lobbyMain{padding:30px}
.sessionCode{font-size:clamp(52px,8vw,88px);font-weight:1000;letter-spacing:12px;color:var(--brand);line-height:1;margin:16px 0}
.joinStats{display:flex;align-items:flex-end;gap:10px;margin:20px 0 8px}
.joinStats b{font-size:44px;color:var(--brand)} .joinStats span{color:var(--muted);padding-bottom:7px}
.nameCloud{display:flex;flex-wrap:wrap;gap:8px;min-height:120px;align-content:flex-start}
.nameChip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:900;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.qrCard{padding:26px;display:grid;place-items:center;text-align:center}
#qr{background:white;padding:14px;border-radius:18px;border:1px solid var(--line)}
.lobbyControls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:22px;flex-wrap:wrap}

/* Question */
.questionLayout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}
.questionCard{padding:26px;min-height:660px;display:flex;flex-direction:column}
.questionTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.timer{width:92px;height:92px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--brand) var(--pct,100%),#e8eeec 0)}
.timer:after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
.timer b{position:relative;z-index:1;font-size:30px}
.questionText{font-size:clamp(28px,3vw,46px);line-height:1.55;font-weight:1000;text-align:center;flex:1;display:grid;place-items:center;padding:12px 5% 24px}
.optionsGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option{min-height:112px;border-radius:22px;padding:18px 20px;color:#fff;display:flex;gap:15px;align-items:center;font-size:clamp(17px,1.35vw,22px);font-weight:900;box-shadow:inset 0 -3px rgba(0,0,0,.08)}
.option:nth-child(1){background:#d94f45} .option:nth-child(2){background:#3e83c5}
.option:nth-child(3){background:#d5a52d} .option:nth-child(4){background:#4f9c58}
.option:nth-child(5){background:#7356a8}
.shape{width:42px;height:42px;flex:0 0 42px;border:3px solid #fff;display:grid;place-items:center;font-size:16px;font-weight:1000}
.shape.a{border-radius:50%} .shape.b{border-radius:10px} .shape.c{transform:rotate(45deg);border-radius:5px} .shape.c span{transform:rotate(-45deg)} .shape.d{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;background:#ffffff22;padding-top:10px}
.sidePanel{display:flex;flex-direction:column;gap:12px}
.kpi{padding:20px;text-align:center} .kpi b{display:block;font-size:40px;color:var(--brand)} .kpi span{font-size:12px;color:var(--muted)}
.progress{height:12px;border-radius:999px;background:#e7efec;overflow:hidden;margin-top:9px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--green));width:var(--progress,0%);transition:.25s}
.hostActions{padding:16px;display:flex;flex-direction:column;gap:10px}

/* Result / leaderboard */
.resultCard{padding:28px}
.resultHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.resultHeader h2{font-size:34px;margin:0 0 6px}
.correctBox{padding:16px 18px;border-radius:18px;background:#eff8ed;border:1px solid #d7ebd1;margin-bottom:18px}
.towerStage{height:360px;border-radius:24px;background:linear-gradient(180deg,#f8fbfa,#eef5f2);border:1px solid var(--line);padding:20px 16px 12px;display:flex;align-items:flex-end;gap:13px;overflow:hidden}
.towerCol{flex:1;height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tower{width:72%;max-width:82px;min-width:24px;height:var(--h,36%);background:linear-gradient(180deg,#69c653,#2f755f 55%,#123f3a);border-radius:14px 14px 5px 5px;transition:.55s cubic-bezier(.2,.75,.15,1);box-shadow:0 11px 28px rgba(18,63,58,.18);position:relative}
.tower:before{content:"";position:absolute;left:20%;right:20%;top:14px;height:5px;border-radius:4px;background:#ffffff66;box-shadow:0 20px 0 #ffffff44,0 40px 0 #ffffff33,0 60px 0 #ffffff28,0 80px 0 #ffffff20}
.towerScore{font-size:12px;font-weight:1000;margin:7px 0 2px} .towerName{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ranking{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.rankRow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:16px}
.rankRow.top{background:linear-gradient(90deg,#fff9ea,#fff)} .rankNum{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#edf4f2;font-weight:1000}
.rankPts{font-weight:1000} .rankMeta{font-size:11px;color:var(--muted)}
.bottomBar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;flex-wrap:wrap}

/* Participant */
.participant{width:min(650px,100%);margin:auto;padding:18px}
.mobileHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mobileQuestion{padding:20px}
.mobileQuestion h2{font-size:22px;line-height:1.55;margin:0 0 16px}
.mobileOption{display:flex;align-items:center;gap:11px;padding:15px;border-radius:16px;border:2px solid transparent;background:#fff;margin-bottom:9px;box-shadow:0 7px 20px rgba(18,63,58,.06)}
.mobileOption.sel{border-color:var(--brand);background:#f1f7f5}
.mobileOption input{display:none}
.mobileSubmit{width:100%;margin-top:10px}
.wait{padding:34px;text-align:center} .pulse{width:54px;height:54px;border-radius:50%;margin:0 auto 18px;background:#dfece7;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(.82);opacity:.5}}
.personalResult{padding:30px;text-align:center}
.bigRank{font-size:76px;font-weight:1000;color:var(--brand);line-height:1} .bigScore{font-size:25px;font-weight:1000;margin:10px 0}
.personalList{margin-top:22px;text-align:right}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:14px;align-items:end;margin:28px 0}
.podiumBox{padding:22px;text-align:center;border:1px solid var(--line);border-radius:22px;background:#fff} .podiumBox.first{padding-top:36px;transform:translateY(-9px);border-color:#e6c96b}
.medal{font-size:40px} .podiumName{font-size:21px;font-weight:1000;margin:8px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#102b2a;color:#fff;padding:11px 16px;border-radius:999px;z-index:9999;box-shadow:0 14px 35px #0003}
.display .hostChrome{display:none!important}
.display .shell{max-width:1800px;padding:16px}
@media(max-width:1050px){.questionLayout{grid-template-columns:1fr}.sidePanel{display:grid;grid-template-columns:repeat(3,1fr)}.hostActions{grid-column:1/-1}}
@media(max-width:760px){
  .shell{padding:12px} .header{align-items:flex-start;flex-wrap:wrap} .brandlogos{width:100%;justify-content:flex-start}
  .roleGrid,.lobbyGrid,.ranking{grid-template-columns:1fr} .optionsGrid{grid-template-columns:1fr}
  .sessionCode{font-size:48px;letter-spacing:7px} .towerStage{height:300px;gap:6px} .towerName{font-size:9px}
  .sidePanel{grid-template-columns:1fr 1fr} .hostActions{grid-column:1/-1} .podium{grid-template-columns:1fr} .podiumBox.first{order:-1;transform:none}
}
</style>

<style>
/* شاشة العرض: هادئة، واسعة، بلا تفاصيل إدارية */
.display body{background:#07110f}
.display .shell{max-width:1900px;padding:22px}
.display .hostChrome{display:none!important}
.display .questionLayout{grid-template-columns:1fr!important}
.display .sidePanel{display:none!important}
.display .questionCard{min-height:calc(100vh - 44px);border:1px solid rgba(255,255,255,.08);background:linear-gradient(145deg,#0b1714,#102520);color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.display .questionCard .pill{background:rgba(255,255,255,.08);color:#dceae6}
.display .questionCard .timer:after{background:#0d1c18}
.display .questionCard .timer b{color:#fff}
.display .questionText{font-size:clamp(38px,4vw,68px);max-width:1500px;margin:auto}
.display .resultCard{min-height:calc(100vh - 44px);background:
radial-gradient(circle at 78% 12%,rgba(97,191,69,.09),transparent 25%),
linear-gradient(160deg,#07110f,#0b1815 55%,#07110f);color:#fff;border-color:rgba(255,255,255,.08);box-shadow:0 30px 90px rgba(0,0,0,.42)}
.display .resultHeader{justify-content:center;text-align:center;margin-bottom:24px}
.display .resultHeader h2{font-size:clamp(38px,4vw,64px);color:#fff}
.display .resultHeader .small,.display .correctBox,.display .ranking{display:none!important}
.display .resultHeader .pill{position:absolute;left:38px;top:36px;background:rgba(255,255,255,.08);color:#dceae6}

/* لوحة الأبراج: كل سطر برج مستقل */
.towerRows{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.towerRow{display:grid;grid-template-columns:58px minmax(160px,240px) 1fr 112px;gap:14px;align-items:center;min-height:58px}
.towerRank{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:1000;background:#edf4f2;color:#123f3a;border:1px solid #dde8e4}
.towerIdentity{min-width:0}
.towerPerson{font-weight:1000;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.towerMeta2{font-size:11px;color:#72827e;margin-top:3px}
.towerTrack{height:48px;position:relative;border-radius:12px;background:#edf3f1;border:1px solid #e0e9e6;overflow:hidden}
.towerBuilding{height:100%;width:var(--w,50%);min-width:9%;position:relative;border-radius:10px 4px 4px 10px;
background:linear-gradient(90deg,#123f3a 0%,#2e755f 55%,#62bd49 100%);
box-shadow:inset 0 1px rgba(255,255,255,.22),0 7px 20px rgba(18,63,58,.16);
transition:width .6s cubic-bezier(.2,.75,.2,1)}
.towerBuilding:before{content:"";position:absolute;inset:8px 10px;background:
repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 5px,transparent 5px 15px);
opacity:.9;border-radius:5px}
.towerBuilding:after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:rgba(255,255,255,.09)}
.towerPoints{text-align:left;font-weight:1000;font-variant-numeric:tabular-nums}
.towerRow:nth-child(1) .towerRank{background:linear-gradient(145deg,#f9db79,#c99a25);color:#4c3500;border:0;box-shadow:0 7px 20px rgba(216,168,44,.25)}
.towerRow:nth-child(1) .towerBuilding{background:linear-gradient(90deg,#a87818,#e6bd4a,#ffe89a);box-shadow:0 8px 28px rgba(214,172,55,.28)}
.towerRow:nth-child(2) .towerRank{background:linear-gradient(145deg,#e7ebee,#aeb8c0);color:#354047;border:0}
.towerRow:nth-child(2) .towerBuilding{background:linear-gradient(90deg,#66747c,#aab5ba,#e5eaec)}
.towerRow:nth-child(3) .towerRank{background:linear-gradient(145deg,#d99a5c,#9c5926);color:#fff;border:0}
.towerRow:nth-child(3) .towerBuilding{background:linear-gradient(90deg,#8c4f26,#bf7740,#e2ae79)}
.display .towerRows{gap:13px;max-width:1500px;margin:10px auto 0}
.display .towerRow{grid-template-columns:64px 260px 1fr 140px;min-height:66px}
.display .towerRank{width:52px;height:52px;border-radius:16px;font-size:20px}
.display .towerPerson{font-size:20px;color:#fff}
.display .towerMeta2{color:#82948f}
.display .towerTrack{height:56px;background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.08)}
.display .towerPoints{font-size:20px;color:#f3f7f6}
.display .towerBuilding{box-shadow:0 12px 28px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.20)}
@media(max-width:900px){
  .towerRow{grid-template-columns:46px 120px 1fr 88px;gap:8px}
  .towerPerson{font-size:12px}
  .towerTrack{height:42px}
}
</style>

<style>

    radial-gradient(circle at 85% -10%,rgba(96,191,69,.14),transparent 30%),

    linear-gradient(180deg,#f9fbfa,#f3f7f5);
}
.home{
  min-height:100vh;
  padding:34px;
  background:
    linear-gradient(135deg,rgba(7,62,54,.025),rgba(96,191,69,.025)),

}
.roleGrid{
  max-width:860px;

}

}

/* ===== شاشة السؤال ===== */

    radial-gradient(circle at 86% 10%,rgba(96,191,69,.075),transparent 22%),
    linear-gradient(160deg,#081612,#0c211b);
}

}

/* ===== أبراج واقعية CSS ===== */
.towerRows{
  display:grid;
  grid-template-columns:repeat(10,minmax(86px,1fr));
  gap:14px;
  align-items:end;
  height:500px;
  padding:28px 18px 18px;
  border-radius:30px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.05),transparent 38%),
    radial-gradient(circle at 50% 100%,rgba(96,191,69,.10),transparent 42%);
  overflow:hidden;
  position:relative;
}
.towerRows:before{
  content:"";
  position:absolute;left:0;right:0;bottom:72px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
}
.towerRow{
  display:flex!important;
  flex-direction:column!important;
  justify-content:flex-end;
  align-items:center;
  height:100%;
  min-height:0!important;
  gap:7px!important;
  position:relative;
}
.towerRank{
  order:1;
  width:40px!important;height:40px!important;
  border-radius:14px!important;
  font-size:16px;
  position:absolute;
  top:0;

 جذري (Root Cause)", "مشكلة مركزية (Core Problem)", "أثر ناتج (Effect/Impact)", "سبب مباشر (Direct Cause)"], "answers": ["أثر ناتج (Effect/Impact)"]}, {"n": 31, "day": "اليوم الثاني", "topic": "Discover – تجربة المستفيد", "q": "أثناء محاولة فريق ابتكار اجتماعي فهم التحديات التي تواجه الأشخاص ذوي الإعاقة الحركية عند استخدام وسائل النقل العام، قرر الفريق التوقف عن النظر للمشكلة كإحصائيات عامة، وبدأوا في رصد تجربة شخصية لأحد المستفيدين منذ لحظة خروجه من المنزل، مرورًا بمحطة الحافلات، وصولًا إلى وجهته النهائية، مع توثيق أدق تفاصيل المعاناة النفسية والجسدية التي يواجهها في كل خطوة. ما هي الأداة المنهجية الأنسب التي استخدمها الفريق لرسم هذا المسار وتحديد 'نقاط الألم' (Pain Points) المرتبطة بالتجربة الحية للمستفيد؟", "options": ["شجرة المشكلة (Problem Tree)", "أداة برادشو لتحليل الاحتياجات (Bradshaw's Model)", "أداة نمذجة المستفيد ورحلته عبر المشكلة (User Persona & Journey Map)", "كانفاس التمهيد التحليلي (Analytical Priming Canvas)"], "answers": ["أداة نمذجة المستفيد ورحلته عبر المشكلة (User Persona & Journey Map)"]}, {"n": 32, "day": "اليوم الثاني", "topic": "Discover – التحقق من الفجوة", "q": "متى يمكن لفريق الابتكار الاجتماعي إصدار حكم نهائي بوجود 'فجوة حقيقية تستدعي التدخل' بناءً على منهجية برادشو المذكورة في المادة؟", "options": ["عند توفر أدلة قوية في نوع واحد فقط من الاحتياجات", "بمجرد شعور الفئة المستهدفة بوجود مشكلة", "عند توفر أدلة متسقة تتقاطع في 3 أنواع احتياج على الأقل", "إذا وافق الخبراء على أن المشكلة تستحق الدراسة"], "answers": ["عند توفر أدلة متسقة تتقاطع في 3 أنواع احتياج على الأقل"]}, {"n": 33, "day": "اليوم الثالث", "topic": "Define – التقارب", "q": "بعد انتهاء الفريق من رحلة ميدانية استغرقت أسابيع، جمعوا خلالها عشرات الملاحظات والقصص والأسباب المتعلقة بمشكلة \"العزلة الاجتماعية لدى المتقاعدين\". الآن، يسعى الفريق إلى فرز هذه البيانات واختيار قضية واحدة دقيقة ومحددة لتكون منطلقًا للابتكار، بدلًا من التعامل مع المشكلة بشكلها الواسع والمشتت.", "options": ["التفكير التباعدي (Divergence)", "التفكير التقاربي (Convergence)", "العصف الذهني المفتوح (Brainstorming)", "مرحلة النمذجة (Prototyping)"], "answers": ["التفكير التقاربي (Convergence)"]}, {"n": 34, "day": "اليوم الثالث", "topic": "Define – AAA", "q": "يعمل فريق على حل مشكلة \"الزحام المروري أمام المدارس\" ووجدوا أن الحل الجذري يتطلب \"تغيير اتجاه الشوارع\"، وهو قرار تملكه حصريًا إدارة المرور ولا يملك الفريق أي صلاحية قانونية للقيام به. لذلك، قرروا بدلًا من ذلك إعادة صياغة نطاق المشكلة للتركيز على \"تنظيم مواعيد خروج الطالب\" بالتنسيق مع المدرسة. أي معيار من أداة (AAA) استند إليه الفريق لتغيير النطاق؟", "options": ["معيار القدرة المادية (Ability)", "معيار القبول الاجتماعي (Acceptance)", "معيار السلطة والنفوذ (Authority)", "معيار القدرة على التكيف (Adaptability)"], "answers": ["معيار السلطة والنفوذ (Authority)"]}, {"n": 35, "day": "اليوم الثالث", "topic": "Define – SPICE", "q": "في ورشة عمل، صاغ أحد أعضاء الفريق المشكلة كالتالي: \"يعاني الشباب في الحي من الفراغ الذي يسبب لهم القلق النفسي\". طالبه أحد المستشارين بإضافة عنصر (Evidence) من نموذج (SPICE) لجعل البيان أكثر مهنية في مرحلة التحديد. أي من الجمل التالية تمثل الإضافة الصحيحة لهذا العنصر؟", "options": ["\"بناءً على مسح ميداني، تبين أن %65 من شباب الحي يقضون 8 ساعات بلا هدف\"", "\"نحن نحتاج إلى بناء نادٍ رياضي متكامل للشباب في الحي\"", "\"يجب على الأمانة التدخل فورًا لحل هذه الأزمة الاجتماعية\"", "\"القلق النفسي هو شعور سلبي يؤثر على الإنتاجية العامة\""], "answers": ["\"بناءً على مسح ميداني، تبين أن %65 من شباب الحي يقضون 8 ساعات بلا هدف\""]}, {"n": 36, "day": "اليوم الثالث", "topic": "Define – SPICE / Impact", "q": "يعمل فريق على صياغة مشكلة \"ضعف المهارات الرقمية لدى المعلمين\". عند كتابة عنصر (Impact) في بيان المشكلة، ما هو التركيز الذي يجب أن يظهر في الجملة ليعبر عن هذا العنصر بدقة؟", "options": ["وصف عدد المعلمين الذين لا يملكون أجهزة حاسب آلي", "وصف النتائج السلبية المستمرة (مثل: تدهور جودة التعليم للطلاب وفقدان التنافسية)", "وصف الطريقة التي سيتم بها تدريب المعلمين", "ذكر أسماء الشركات التي ستقدم الدعم التقني"], "answers": ["وصف النتائج السلبية المستمرة (مثل: تدهور جودة التعليم للطلاب وفقدان التنافسية)"]}, {"n": 37, "day": "اليوم الثالث", "topic": "Define – AAA", "q": "خلال ورشة عمل في مرحلة التحديد لتصفية شجرة المشكلة واختيار نطاق التدخل، قام الفريق بتقييم معيار \"القدرة\" (Ability) لأحد الأسباب الرئيسية وصوّتوا بالإيجاب بناءً على تقديراتهم الشخصية. رفض قائد الورشة الاعتماد على هذا التصويت، ووجّه الفريق لجمع بيانات موضوعية عبر مراجعة المراجع الثانوية، إجراء مقارنات مرجعية، وعقد اجتماعات مع خبراء لتقييم القدرة التنفيذية والمالية بدقة قبل اتخاذ قرار الإبقاء على هذا السبب أو حذفه. ما هو المبدأ الذي طبقه القائد؟", "options": ["مبدأ الاعتماد على البراهين (Evidence-Based Principle)", "مبدأ التصميم المنظومي المتمحور حول الإنسان (Human-Centered Systems Design)", "مبدأ التشاركية في الإبداع (Co-Creation Principle)", "مبدأ التركيز على الأثر (Impact-Driven Principle)"], "answers": ["مبدأ الاعتماد على البراهين (Evidence-Based Principle)"]}, {"n": 38, "day": "اليوم الثالث", "topic": "Define – السياق المنظومي", "q": "أثناء نشاط \"بناء شجرة المشكلة النهائية\"، نجح الفريق في تحديد نطاق التدخل بدقة واستبعدوا الأسباب المتعلقة بـ \"البيروقراطية المؤسسية\" لعدم امتلاكهم سلطة عليها (Authority). ومع ذلك، وجّه القائد بوضع هذه الأسباب المستبعدة في \"قائمة المخاطر والسياق\" المرافقة للشجرة، محذرًا من أن إغفالها عند تصميم الحل سيجعل الابتكار الاجتماعي معزولًا عن الواقع الذي يعيشه المستفيد. ما هو المبدأ الذي ما هو المبدأ الذي طبقه القائد؟", "options": ["مبدأ الاعتماد على البراهين (Evidence-Based Principle)", "مبدأ التصميم المنظومي المتمحور حول الإنسان (Human-Centered Systems Design)", "مبدأ التشاركية في الإبداع (Co-Creation Principle)", "مبدأ التركيز على الأثر (Impact-Driven Principle)"], "answers": ["مبدأ التصميم المنظومي المتمحور حول الإنسان (Human-Centered Systems Design)"]}, {"n": 39, "day": "اليوم الثالث", "topic": "Define – شجرة المشكلة النهائية", "q": "أثناء العمل على \"شجرة المشكلة النهائية\"، سأل أحد الأعضاء: \"لماذا نعيد بناء الشجرة وقد رسمناها سابقًا في مرحلة الاستكشاف؟\". أي من الإجابات التالية توضح الفرق المنهجي الصحيح؟ (اختر كل ما ينطبق)", "options": ["الشجرة هنا تقاربية تهدف لتنقيح العناصر وتركيز النطاق، بينما كانت في الاستكشاف تباعدية تهدف للتحليل الواسع", "الشجرة هنا تهدف لاكتشاف أسباب جديدة لم تظهر في مرحلة الاستكشاف", "الشجرة هنا تقتصر على الأسباب والآثار القابلة للتدخل فقط، بينما كانت السابقة تشمل كل العلاقات الممكنة", "الشجرة السابقة تظل مرجعًا لفهم المخاطر والسياق، بينما الشجرة الحالية تمثل نطاق العمل الفعلي"], "answers": ["الشجرة هنا تقاربية تهدف لتنقيح العناصر وتركيز النطاق، بينما كانت في الاستكشاف تباعدية تهدف للتحليل الواسع", "الشجرة هنا تقتصر على الأسباب والآثار القابلة للتدخل فقط، بينما كانت السابقة تشمل كل العلاقات الممكنة", "الشجرة السابقة تظل مرجعًا لفهم المخاطر والسياق، بينما الشجرة الحالية تمثل نطاق العمل الفعلي"]}, {"n": 40, "day": "اليوم الثالث", "topic": "Define – التركيز على الأثر", "q": "أثناء تنقية شجرة المشكلة، وجد الفريق سببًا يملكون عليه سلطة كاملة (Authority) وقدرة مالية (Ability)، لكنهم اكتشفوا أن التدخل فيه لن يؤدي في النهاية إلى تغيير ملموس في حياة الفئة المستهدفة. فقرروا حذفه رغم سهولة تنفيذه. أي مبدأ وجه هذا القرار؟", "options": ["مبدأ التصميم المنظومي", "مبدأ التركيز على الأثر", "مبدأ الاعتماد على البراهين", "مبدأ التشاركية في الإبداع"], "answers": ["مبدأ التركيز على الأثر"]}, {"n": 41, "day": "اليوم الثالث", "topic": "Define – المؤشرات وخط الأساس", "q": "أثناء تحديد مؤشرات السبب المعتمد \"ضعف المهارات الرقمية\"، أصر القائد على أن يكون المؤشر هو (نسبة المعلمين الذين لم يجتازوا اختبار الكفايات التقنية) بدلًا من كتابة \"مهارات ضعيفة\". ما هو الهدف المنهجي من صياغة هذه المؤشرات في هذه المرحلة؟", "options": ["Authority Confirmation: التأكد من أن الفريق يملك السلطة القانونية لقياس مهارات المعلمين", "Establishing Baselines: بناء خطوط أساس تعكس حجم المشكلة من جهة أسبابها لفهم الفجوة الحقيقية", "Adaptive Design: تغيير تصميم الحل بناءً على سرعة استجابة المعلمين للاختبارات", "Co-Creation Validation: إشراك المعلمين في وضع أسئلة الاختبارات التقنية"], "answers": ["Establishing Baselines: بناء خطوط أساس تعكس حجم المشكلة من جهة أسبابها لفهم الفجوة الحقيقية"]}, {"n": 42, "day": "اليوم الثالث", "topic": "Define – اعتماد المشكلة", "q": "عند الانتهاء من بناء \"شجرة المشكلة النهائية\" وتنقيحها، دعا قائد الفريق جميع أصحاب المصلحة (ممولين ومستفيدين) للمصادقة على بيان المشكلة النهائي. كان غرضه من هذه الخطوة هو ضمان أن كل طرف يرى المشكلة من نفس الزاوية، مما يقلل احتمالات رفض الحلول المقترحة مستقبلًا. أي مبدأ يصف اعتبار هؤلاء الشركاء \"مساهمين فاعلين\" في اعتماد تعريف المشكلة لزيادة قابليتها للاستدامة؟", "options": ["مبدأ الاعتماد على البراهين", "مبدأ التصميم المنظومي المتمحور حول الإنسان", "مبدأ التشاركية في الإبداع (Co-Creation Principle)", "مبدأ التركيز على الأثر"], "answers": ["مبدأ التشاركية في الإبداع (Co-Creation Principle)"]}, {"n": 43, "day": "اليوم الثالث", "topic": "Define → Develop – شجرة الأهداف", "q": "أثناء انتقال الفريق من مساحة المشكلة إلى مساحة الحل، قام الفريق بتحويل سبب \"ضعف المهارات التقنية لدى المعلمين\" في شجرة المشكلة إلى عبارة \"امتلاك المعلمين لمهارات تقنية متقدمة\" في شجرة الأهداف. ما هو التصنيف المنهجي الصحيح لهذه العبارة الجديدة وفقًا لمستويات النتائج؟", "options": ["الأثر الإيجابي طويل المدى (Impact)", "الهدف الرئيسي للمشروع (Outcome)", "المخرجات التنفيذية الإيجابية (Outputs)", "الرؤية الاستراتيجية للمنظمة"], "answers": ["المخرجات التنفيذية الإيجابية (Outputs)"]}, {"n": 44, "day": "اليوم الرابع", "topic": "Develop – السؤال الموجه", "q": "أراد فريق صياغة سؤال تصميمي لمشكلة \"انخفاض القراءة لدى الأطفال\". أي من الصياغات التالية تعتبر الأفضل منهجيًا وفق أداة كانفاس السؤال الموجّه؟", "options": ["كيف يمكننا توفير مكتبات متنقلة لزيادة عدد الكتب المتاحة للأطفال؟", "كيف يمكننا تحسين تجربة القراءة للطفل لتعزيز شغفه المعرفي بما يسهم في رفع وعي المجتمع؟", "كيف يمكننا إجبار المدارس على تخصيص ساعة يومية للقراءة الحرة؟", "كيف يمكننا شراء أجهزة لوحية وتطبيقات تفاعلية لتعويض نقص الكتب الورقية؟"], "answers": ["كيف يمكننا تحسين تجربة القراءة للطفل لتعزيز شغفه المعرفي بما يسهم في رفع وعي المجتمع؟"]}, {"n": 45, "day": "اليوم الرابع", "topic": "Develop – التباعد", "q": "خلال ورشة عمل لتوليد الحلول الابتكارية، بدأ بعض أعضاء الفريق بممارسة النقد للأفكار المطروحة، مستبعدين الأفكار \"غير الواقعية\" أو \"عالية التكلفة\". من الناحية المنهجية، كيف يُصنّف هذا السلوك ضمن نشاط \"توليد أكبر عدد ممكن من الأفكار\"؟", "options": ["نضج تقييمي مبكر: إجراء ضروري لتوفير الوقت والجهد عبر حصر النقاش في الأفكار القابلة للتنفيذ فقط", "إخلال بآلية التباعد (Divergence): ممارسة تُعيق اتساع آفاق الحلول الممكنة وتؤدي إلى التقييد المبكر للتفكير الابتكاري", "تحسين جودة المخرجات: خطوة تقنية تهدف لرفع كفاءة \"بطاقات الأفكار\" قبل الانتقال لمرحلة التنقيح", "تطبيق لمعيار القدرة (Ability): ممارسة صحيحة لضمان عدم طرح حلول تتجاوز إمكانيات الفريق المتاحة"], "answers": ["إخلال بآلية التباعد (Divergence): ممارسة تُعيق اتساع آفاق الحلول الممكنة وتؤدي إلى التقييد المبكر للتفكير الابتكاري"]}, {"n": 46, "day": "اليوم الرابع", "topic": "Develop – توليد الحلول", "q": "في نشاط \"توليد أكبر عدد ممكن من الأفكار\"، سعى الفريق لتوسيع مساحة الحلول لمشكلة \"تأخر الاستجابة للبلاغات\" عبر استخدام مجموعة من استراتيجيات التفكير الابتكاري. أي من الممارسات التالية تُعد تطبيقًا صحيحًا لهذه التقنيات وفق المنهجية؟ (اختر كل ما ينطبق)", "options": ["استخدام استراتيجية SCAMPER لاستكشاف إمكانيات \"الاستبدال\" أو \"الدمج\" أو \"التعديل\" في عناصر الخدمة الحالية لإنتاج بدائل جديدة", "تطبيق تقنية دلفاي (Delphi) في هذه المرحلة لتصفية الأفكار واستبعاد غير الواقعي منها لضمان عدم تشتيت الفريق", "تطبيق مبادئ TRIZ لحل التناقضات التقنية أو الإدارية في المشكلة عبر استلهام حلول ابتكارية من نماذج عالمية ناجحة", "استخدام تقنية التفكير بالعكس من خلال تخيل كيفية \"زيادة تأخير البلاغات\" ثم عكس تلك النتائج للوصول إلى أفكار غير مألوفة"], "answers": ["استخدام استراتيجية SCAMPER لاستكشاف إمكانيات \"الاستبدال\" أو \"الدمج\" أو \"التعديل\" في عناصر الخدمة الحالية لإنتاج بدائل جديدة", "تطبيق مبادئ TRIZ لحل التناقضات التقنية أو الإدارية في المشكلة عبر استلهام حلول ابتكارية من نماذج عالمية ناجحة", "استخدام تقنية التفكير بالعكس من خلال تخيل كيفية \"زيادة تأخير البلاغات\" ثم عكس تلك النتائج للوصول إلى أفكار غير مألوفة"]}, {"n": 47, "day": "اليوم الرابع", "topic": "Develop – دلفاي", "q": "بعد توليد 50 فكرة أولية، قرر القائد استخدام \ function brandHeader(sub=''){return `<div class="brand"><div class="sipcBadge">SIPC</div><div><div class="brandTitle">الممارس المعتمد في الابتكار الاجتماعي</div><div class="brandSub">${esc(sub)}</div></div>${LOGOS}</div>`}
function sortedPlayers(){return Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)||(b[1].correct||0)-(a[1].correct||0))}
function currentQ(){return state ? dayQs(state.day)[state.idx] : null}
function answerStats(){
  const q=currentQ(), arr=Object.values(players), total=arr.length;
  const answered=q?arr.filter(p=>p.answers&&p.answers[q.n]).length:0;
  return {total,answered,remaining:Math.max(0,total-answered),pct:total?Math.round(answered/total*100):0};
}

async function openHost(){
  role='host'; clearTimers();
  app.innerHTML=`<div class="shell"><div class="card" style="max-width:620px;margin:10vh auto;padding:28px;text-align:center"><span class="pill">شاشة المدرب</span><h2 style="margin:16px 0 8px">جاري فتح الجلسة…</h2><div class="small">يتم الاتصال بقاعدة البيانات</div><button class="btn" style="margin-top:18px" onclick="showHome()">رجوع</button></div></div>`;
  let code=localStorage.getItem('sipcHostCode');
  if(!code) code=makeCode();
  sessionRef=db.ref('sessions/'+code);
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
    let snap=await Promise.race([sessionRef.once('value'),timeout]);
    if(role!=='host')return;
    if(!snap.exists()){
      state={code,day:DAYS[0],idx:0,phase:'lobby',endsAt:null};
      await Promise.race([sessionRef.set({state,createdAt:firebase.database.ServerValue.TIMESTAMP,players:{},answers:{},results:{}}),timeout]);
    } else {

async function gradeAnswer(key,a){
  if(!a||a.graded)return;
  const stSnap=await sessionRef.child('state').once('value'), st=stSnap.val();
  if(!st)return;
  const q=dayQs(st.day)[st.idx];
  if(!q||q.n!==a.qn)return;

  // نقبل الإجابة إذا أُرسلت خلال وقت السؤال، مع مهلة شبكة 5 ثوانٍ.
  const deadline=(st.endsAt||0)+5000;
  const sentAt=Number(a.sentAt||0);
  const canGrade=(st.phase==='question'||st.phase==='results') && (!deadline || !sentAt || sentAt<=deadline);
  if(!canGrade){
    await sessionRef.child('answers/'+key+'/graded').set(true);
    return;
  }

  const playerRef=sessionRef.child('players/'+a.pid);
  const pSnap=await playerRef.once('value'), p=pSnap.val();
  if(!p){
    await sessionRef.child('answers/'+key+'/graded').set(true);
    return;
  }
  if(p.answers?.[q.n]){
    await sessionRef.child('answers/'+key+'/graded').set(true);
    return;
  }

  const correctSet=new Set(q.answers.map(norm)), pickedSet=new Set((a.picks||[]).map(i=>norm(q.options[i])));
  const ok=correctSet.size===pickedSet.size&&[...correctSet].every(x=>pickedSet.has(x));
  const elapsed=Math.min(90000,Math.max(0,a.elapsed||90000));
  const points=ok?1000+Math.round(500*(1-elapsed/90000)):0;

  // Transaction تمنع تعارض تحديث النقاط لو وصلت طلبات متزامنة.
  await playerRef.transaction(cur=>{
    if(!cur)return cur;
    cur.answers=cur.answers||{};
    if(cur.answers[q.n])return cur;
    cur.answers[q.n]={ok,points};
    cur.score=(cur.score||0)+points;
    cur.correct=(cur.correct||0)+(ok?1:0);
    return cur;
  });

  const finalSnap=await playerRef.once('value'), finalP=finalSnap.val()||p;
  const updates={};
  updates[`results/${a.pid}/${q.n}`]={ok,points,total:finalP.score||0};
  updates[`answers/${key}/graded`]=true;
  await sessionRef.update(updates);
}

function practicePick(i,multi){if(!multi){practiceSelected.clear();$$('.practiceOption').forEach(x=>x.classList.remove('sel'));practiceSelected.add(i);$('#po'+i).classList.add('sel')}else{practiceSelected.has(i)?practiceSelected.delete(i):practiceSelected.add(i);$('#po'+i).classList.toggle('sel')}}

function practiceResultData(){let correctCount=0,wrong=[];practiceQs.forEach((q,idx)=>{const selected=practiceResponses[idx]?.selected||[];const correct=new Set(q.answers.map(norm));const picked=new Set(selected.map(i=>norm(q.options[i])));const ok=correct.size===picked.size&&[...correct].every(x=>picked.has(x));if(ok)correctCount++;else wrong.push({q,idx,selected});});return{correctCount,wrong};}

const LOCAL_PRACTICE_ARCHIVE='sipcPracticeAttemptArchiveV1';
function getLocalPracticeArchive(){try{const x=JSON.parse(localStorage.getItem(LOCAL_PRACTICE_ARCHIVE)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function putLocalPracticeArchive(item){const arr=getLocalPracticeArchive();const i=arr.findIndex(x=>x&&x.id===item.id);if(i>=0)arr[i]={...arr[i],...item};else arr.push(item);try{localStorage.setItem(LOCAL_PRACTICE_ARCHIVE,JSON.stringify(arr.slice(-100)))}catch(e){console.warn('تعذر الأرشفة المحلية',e)}}
async function savePracticeAttempt(score,correctCount,wrongCount){
  const attemptId=practiceAttemptId||db.ref('practiceResults').push().key;
  practiceAttemptId=attemptId;
  if(practiceSavedAttemptIds.has(attemptId))return;
  const name=(localStorage.getItem('sipcPracticeName')||'').trim()||'متدرب';
  const answers=practiceQs.map((q,idx)=>({n:q.n,selected:(practiceResponses[idx]?.selected||[]).map(i=>q.options[i]),correct:q.answers}));
  const localCompletedAt=Date.now();
  const payload={name,score,correctCount,wrongCount,total:practiceQs.length,answers};
  putLocalPracticeArchive({id:attemptId,...payload,completedAt:localCompletedAt,synced:false});
  try{
    await db.ref('practiceResults/'+attemptId).set({...payload,completedAt:firebase.database.ServerValue.TIMESTAMP});
    practiceSavedAttemptIds.add(attemptId);putLocalPracticeArchive({id:attemptId,...payload,completedAt:localCompletedAt,synced:true});
  }catch(e){console.error('تعذر حفظ محاولة التدريب',e);toast('ظهرت نتيجتك، وحُفظت على هذا الجهاز لحين استعادتها للمدرب')}
}
let practiceRecoveryRunning=false;
async function recoverLocalPracticeAttempts({silent=true}={}){
  if(practiceRecoveryRunning)return {restored:0,existing:0,failed:0};
  const archive=getLocalPracticeArchive();
  if(!archive.length)return {restored:0,existing:0,failed:0};
  practiceRecoveryRunning=true;
  let restored=0,existing=0,failed=0;
  try{
    for(const a of archive){
      if(!a||!a.id)continue;
      try{
        const ref=db.ref('practiceResults/'+a.id),snap=await ref.once('value');
        if(snap.exists()){existing++;putLocalPracticeArchive({...a,synced:true});continue}
        const {id,synced,...payload}=a;
        await ref.set({...payload,completedAt:a.completedAt||firebase.database.ServerValue.TIMESTAMP});
        restored++;putLocalPracticeArchive({...a,synced:true});
      }catch(e){failed++;console.error('فشل استعادة محاولة',a?.id,e)}
    }
  }finally{practiceRecoveryRunning=false}
  if(!silent&&restored)toast(`تمت استعادة ${restored} محاولة`);
  return {restored,existing,failed};
}

}

async function joinSession(){
  playerName=$('#pname').value.trim();const code=$('#pcode').value.trim();
  if(!playerName||code.length<4)return toast('اكتب الاسم ورمز الجلسة');

  participantWait('جاري الاتصال','لحظات ويتم إدخالك إلى الجلسة…');
  role='participant';participantCode=code;
  sessionRef=db.ref('sessions/'+code);

  try{
    const s=await sessionRef.once('value');
    if(!s.exists())return participantError('لم يتم العثور على الجلسة.');

    playerId=localStorage.getItem('sipcPid-'+code)||db.ref().push().key;
    localStorage.setItem('sipcPid-'+code,playerId);
    localStorage.setItem('sipcName-'+code,playerName);

    await sessionRef.child('players/'+playerId).transaction(p=>p?{...p,name:playerName}:{name:playerName,score:0,correct:0,answers:{}});

    if(participantStateRef)participantStateRef.off();
    participantStateRef=sessionRef.child('state');

    participantStateRef.on('value',
      snap=>participantState(snap.val()),
      ()=>scheduleReconnect()
    );

    // راقب الاتصال؛ لو انقطع الإنترنت نعيد الربط تلقائيًا بدون إخراج المشارك.
    db.ref('.info/connected').on('value',snap=>{
      if(role!=='participant')return;
      if(snap.val()===false){
        participantWait('انقطع الاتصال مؤقتًا','جاري إعادة الاتصال تلقائيًا…');
      }else if(participantCode){
        clearTimeout(reconnectTimer);
      }
    });
  }catch(e){
    scheduleReconnect();
  }
}

function scheduleReconnect(){
  if(role!=='participant'||!participantCode)return;
  clearTimeout(reconnectTimer);
  participantWait('جاري إعادة الاتصال','لن تفقد نقاطك.');
  reconnectTimer=setTimeout(async()=>{
    try{
      const snap=await db.ref('sessions/'+participantCode).once('value');
      if(!snap.exists())return participantError('انتهت الجلسة أو لم تعد متاحة.');
      sessionRef=db.ref('sessions/'+participantCode);
      if(participantStateRef)participantStateRef.off();
      participantStateRef=sessionRef.child('state');
      participantStateRef.on('value',s=>participantState(s.val()),()=>scheduleReconnect());
      const st=await sessionRef.child('state').once('value');
      participantState(st.val());
    }catch(e){
      scheduleReconnect();
    }
  },1500);
}

async function participantState(st){
  clearTimers();
  if(!st){
    // لا نخرج المشارك بسبب قراءة فارغة مؤقتة؛ نحاول إعادة الاتصال.
    return scheduleReconnect();
  }
  state=st;

  if(st.phase==='lobby')return participantWait('تم تسجيل دخولك','بانتظار بدء المسابقة…');
  if(st.phase==='ready')return participantWait(`السؤال ${st.idx+1} قريبًا`,'استعد…');

  if(st.phase==='question'){
    // إذا كان قد أجاب على هذا السؤال قبل تحديث الصفحة/انقطاع الاتصال، لا نسمح بإجابة ثانية.
    try{
      const q=currentQ();
      const ps=await sessionRef.child('players/'+playerId+'/answers/'+q.n).once('value');
      if(ps.exists()){
        return participantWait('تم استلام إجابتك','بانتظار انتهاء السؤال…');
      }
    }catch(e){}
    return renderParticipantQuestion();
  }

  if(st.phase==='results')return renderParticipantResult(false);
  if(st.phase==='final')return renderParticipantResult(true);
}

async function renderParticipantResult(final=false){
  const pSnap=await sessionRef.child('players').once('value'), all=pSnap.val()||{};
  const list=Object.entries(all).sort((a,b)=>(b[1].score||0)-(a[1].score||0)||(b[1].correct||0)-(a[1].correct||0));

  const q=currentQ();
  let res=null;if(q){const r=await sessionRef.child(`results/${playerId}/${q.n}`).once('value');res=r.val()}
  app.innerHTML=`<div class="participant"><div class="header">${brandHeader(final?'النتيجة النهائية':'نتيجة السؤال')}</div>
    <div class="card personalResult">
      ${!final?`<div class="pill" style="margin-bottom:16px">${res?.ok?'إجابة صحيحة ✓':'إجابة غير صحيحة'}</div>`:''}
      <div class="small">${final?'ترتيبك النهائي':'ترتيبك الحالي'}</div><div class="bigRank">#${rank}</div>
      <div class="bigScore">${(me.score||0).toLocaleString('ar-SA')} نقطة</div>
      <div class="small">${me.correct||0} إجابة صحيحة · من أصل ${list.length} مشارك</div>
      ${!final?`<div style="margin-top:12px"><b>${res?.points?`+${res.points} نقطة`:'0 نقطة'}</b></div>`:''}
      <div class="personalList"><b>أفضل 5</b><div style="margin-top:9px">${list.slice(0,5).map(([id,p],i)=>`<div class="rankRow ${id===playerId?'top':''}"><div class="rankNum">${i+1}</div><div><b>${esc(p.name)}</b></div><div class="rankPts">${(p.score||0).toLocaleString('ar-SA')}</div></div>`).join('')}</div></div>
      <div class="pill" style="margin-top:18px">${final?'انتهت المسابقة':'ننتظر السؤال التالي…'}</div>
    </div></div>`;
}

recoverLocalPracticeAttempts({silent:true}).catch(()=>{});
if(new URLSearchParams(location.search).get('join')) showJoin(); else showHome();
</script>
</body></html>
