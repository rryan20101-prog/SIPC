<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الممارس المعتمد في الابتكار الاجتماعي | SIPC</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#102b2a;--muted:#667774;--paper:#fff;--bg:#f4f7f6;--line:#dfe9e6;
  --brand:#123f3a;--brand2:#2d6f63;--green:#61bf45;--blue:#4c9fd1;--orange:#ed7d31;
  --red:#d94f45;--violet:#6750a4;--shadow:0 20px 60px rgba(18,63,58,.10)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{min-height:100vh}
.shell{max-width:1440px;margin:auto;padding:20px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.sipcBadge{width:60px;height:60px;border-radius:18px;background:linear-gradient(145deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:1000;box-shadow:0 12px 28px rgba(18,63,58,.20);letter-spacing:.5px}
.brandTitle{font-size:21px;font-weight:1000;line-height:1.25}
.brandSub{font-size:12px;color:var(--muted);margin-top:4px}
.brandlogos{display:flex;align-items:center;gap:9px;margin-inline-start:auto}
.brandlogos img{display:block;object-fit:contain;background:#fff;border:1px solid #edf2f0;border-radius:12px;padding:5px}
.brandlogos .areeb{width:70px;height:54px} .brandlogos .adp{width:112px;height:54px}
.btn{border:0;border-radius:15px;padding:12px 18px;font-weight:900;background:#edf3f1;color:var(--brand);transition:.18s}
.btn:hover{transform:translateY(-1px)} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brand);color:#fff} .btn.green{background:var(--green);color:#fff}
.btn.orange{background:var(--orange);color:#fff} .btn.red{background:var(--red);color:#fff}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:#eef5f2;color:var(--brand);padding:8px 12px;font-size:12px;font-weight:900}
.input{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:#fff;outline:none}
.input:focus{border-color:#88b7a8;box-shadow:0 0 0 4px #88b7a822}
.small{font-size:12px;color:var(--muted)}
.home{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:28px}
.homeInner{width:min(920px,100%)}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:clamp(34px,5vw,58px);margin:14px 0 8px;letter-spacing:-1.2px}
.hero p{margin:0;color:var(--muted);font-size:16px}
.roleGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.roleCard{border:1px solid var(--line);border-radius:24px;padding:26px;background:#fff;transition:.2s;min-height:190px}
.roleCard:hover{transform:translateY(-3px);box-shadow:0 18px 45px rgba(18,63,58,.10)}
.roleIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#eef5f2;margin-bottom:28px}
.roleCard h3{font-size:24px;margin:0 0 7px} .roleCard p{margin:0 0 18px;color:var(--muted)}

/* Lobby */
.lobbyGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.lobbyMain{padding:30px}
.sessionCode{font-size:clamp(52px,8vw,88px);font-weight:1000;letter-spacing:12px;color:var(--brand);line-height:1;margin:16px 0}
.joinStats{display:flex;align-items:flex-end;gap:10px;margin:20px 0 8px}
.joinStats b{font-size:44px;color:var(--brand)} .joinStats span{color:var(--muted);padding-bottom:7px}
.nameCloud{display:flex;flex-wrap:wrap;gap:8px;min-height:120px;align-content:flex-start}
.nameChip{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:900;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.qrCard{padding:26px;display:grid;place-items:center;text-align:center}
#qr{background:white;padding:14px;border-radius:18px;border:1px solid var(--line)}
.lobbyControls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:22px;flex-wrap:wrap}

/* Question */
.questionLayout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}
.questionCard{padding:26px;min-height:660px;display:flex;flex-direction:column}
.questionTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.timer{width:92px;height:92px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--brand) var(--pct,100%),#e8eeec 0)}
.timer:after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
.timer b{position:relative;z-index:1;font-size:30px}
.questionText{font-size:clamp(28px,3vw,46px);line-height:1.55;font-weight:1000;text-align:center;flex:1;display:grid;place-items:center;padding:12px 5% 24px}
.optionsGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option{min-height:112px;border-radius:22px;padding:18px 20px;color:#fff;display:flex;gap:15px;align-items:center;font-size:clamp(17px,1.35vw,22px);font-weight:900;box-shadow:inset 0 -3px rgba(0,0,0,.08)}
.option:nth-child(1){background:#d94f45} .option:nth-child(2){background:#3e83c5}
.option:nth-child(3){background:#d5a52d} .option:nth-child(4){background:#4f9c58}
.option:nth-child(5){background:#7356a8}
.shape{width:42px;height:42px;flex:0 0 42px;border:3px solid #fff;display:grid;place-items:center;font-size:16px;font-weight:1000}
.shape.a{border-radius:50%} .shape.b{border-radius:10px} .shape.c{transform:rotate(45deg);border-radius:5px} .shape.c span{transform:rotate(-45deg)} .shape.d{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;background:#ffffff22;padding-top:10px}
.sidePanel{display:flex;flex-direction:column;gap:12px}
.kpi{padding:20px;text-align:center} .kpi b{display:block;font-size:40px;color:var(--brand)} .kpi span{font-size:12px;color:var(--muted)}
.progress{height:12px;border-radius:999px;background:#e7efec;overflow:hidden;margin-top:9px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--green));width:var(--progress,0%);transition:.25s}
.hostActions{padding:16px;display:flex;flex-direction:column;gap:10px}

/* Result / leaderboard */
.resultCard{padding:28px}
.resultHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.resultHeader h2{font-size:34px;margin:0 0 6px}
.correctBox{padding:16px 18px;border-radius:18px;background:#eff8ed;border:1px solid #d7ebd1;margin-bottom:18px}
.towerStage{height:360px;border-radius:24px;background:linear-gradient(180deg,#f8fbfa,#eef5f2);border:1px solid var(--line);padding:20px 16px 12px;display:flex;align-items:flex-end;gap:13px;overflow:hidden}
.towerCol{flex:1;height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tower{width:72%;max-width:82px;min-width:24px;height:var(--h,36%);background:linear-gradient(180deg,#69c653,#2f755f 55%,#123f3a);border-radius:14px 14px 5px 5px;transition:.55s cubic-bezier(.2,.75,.15,1);box-shadow:0 11px 28px rgba(18,63,58,.18);position:relative}
.tower:before{content:"";position:absolute;left:20%;right:20%;top:14px;height:5px;border-radius:4px;background:#ffffff66;box-shadow:0 20px 0 #ffffff44,0 40px 0 #ffffff33,0 60px 0 #ffffff28,0 80px 0 #ffffff20}
.towerScore{font-size:12px;font-weight:1000;margin:7px 0 2px} .towerName{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ranking{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.rankRow{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:16px}
.rankRow.top{background:linear-gradient(90deg,#fff9ea,#fff)} .rankNum{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#edf4f2;font-weight:1000}
.rankPts{font-weight:1000} .rankMeta{font-size:11px;color:var(--muted)}
.bottomBar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;flex-wrap:wrap}

/* Participant */
.participant{width:min(650px,100%);margin:auto;padding:18px}
.mobileHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mobileQuestion{padding:20px}
.mobileQuestion h2{font-size:22px;line-height:1.55;margin:0 0 16px}
.mobileOption{display:flex;align-items:center;gap:11px;padding:15px;border-radius:16px;border:2px solid transparent;background:#fff;margin-bottom:9px;box-shadow:0 7px 20px rgba(18,63,58,.06)}
.mobileOption.sel{border-color:var(--brand);background:#f1f7f5}
.mobileOption input{display:none}
.mobileSubmit{width:100%;margin-top:10px}
.wait{padding:34px;text-align:center} .pulse{width:54px;height:54px;border-radius:50%;margin:0 auto 18px;background:#dfece7;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(.82);opacity:.5}}
.personalResult{padding:30px;text-align:center}
.bigRank{font-size:76px;font-weight:1000;color:var(--brand);line-height:1} .bigScore{font-size:25px;font-weight:1000;margin:10px 0}
.personalList{margin-top:22px;text-align:right}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:14px;align-items:end;margin:28px 0}
.podiumBox{padding:22px;text-align:center;border:1px solid var(--line);border-radius:22px;background:#fff} .podiumBox.first{padding-top:36px;transform:translateY(-9px);border-color:#e6c96b}
.medal{font-size:40px} .podiumName{font-size:21px;font-weight:1000;margin:8px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#102b2a;color:#fff;padding:11px 16px;border-radius:999px;z-index:9999;box-shadow:0 14px 35px #0003}
.display .hostChrome{display:none!important}
.display .shell{max-width:1800px;padding:16px}
@media(max-width:1050px){.questionLayout{grid-template-columns:1fr}.sidePanel{display:grid;grid-template-columns:repeat(3,1fr)}.hostActions{grid-column:1/-1}}
@media(max-width:760px){
  .shell{padding:12px} .header{align-items:flex-start;flex-wrap:wrap} .brandlogos{width:100%;justify-content:flex-start}
  .roleGrid,.lobbyGrid,.ranking{grid-template-columns:1fr} .optionsGrid{grid-template-columns:1fr}
  .sessionCode{font-size:48px;letter-spacing:7px} .towerStage{height:300px;gap:6px} .towerName{font-size:9px}
  .sidePanel{grid-template-columns:1fr 1fr} .hostActions{grid-column:1/-1} .podium{grid-template-columns:1fr} .podiumBox.first{order:-1;transform:none}
}
</style>
</head>
<body><div id="app"></div>
<script>

ي يمارسه الفريق حاليًا؟", "options": ["التحقق من الاحتياج المعياري", "التمهيد التحليلي للمشكلة المجتمعية", "تحليل الأسباب الجذرية", "تحديد الفئة المستهدفة النهائية"], "answers": ["التمهيد التحليلي للمشكلة المجتمعية"]}, {"n": 27, "day": "اليوم الثاني", "topic": "Discover – برادشو", "q": "يرغب فريق في التأكد من فجوة 'نقص الحدائق' في الحي (أ)، فقاموا بدراسة وضع الحي (ب) المجاور الذي يشابهه في الكثافة السكانية والميزانية ووجدوا فرقًا شاسعًا. هذا الإجراء يمثل:", "options": ["الاحتياج المستشعر (Felt Need)", "الاحتياج المعياري (Normative Need)", "الاحتياج المقارن (Comparative Need)", "الاحتياج المعبر عنه (Expressed Need)"], "answers": ["الاحتياج المقارن (Comparative Need)"]}, {"n": 28, "day": "اليوم الثاني", "topic": "Discover – نمط التفكير", "q": "أثناء ورشة للعمل على شجرة مشكلة، أصر ميسر الوررشة على جمع كافة الأفكار والمعلومات من زوايا مختلفة (بيئية، اقتصادية، اجتماعية) دون استبعاد أي سبب محتمل في هذه المرحلة المبكرة. ما هو نمط التفكير المطبق؟", "options": ["التفكير التقاربي (Convergent Thinking)", "التفكير التباعدي (Divergent Thinking)", "التفكير الخطي (Linear Thinking)", "التفكير النقدي التقييمي (Critical Thinking)"], "answers": ["التفكير التباعدي (Divergent Thinking)"]}, {"n": 29, "day": "اليوم الثاني", "topic": "Discover – برادشو", "q": "لإثبات 'الاحتياج المعبر عنه فعليًا' بخصوص نقص مراكز الشباب، قام الفريق بحصر عدد العرائض الموقعة من الأهالي وقوائم الانتظار في الأندية المجاورة. لماذا تعتبر هذه الأداة هي الأنسب هنا؟", "options": ["لأنها تعبر عن آراء الخبراء والمعايير المهنية", "لأنها ترصد تحول الشعور بالحاجة إلى سلوك فعلي (طلب الخدمة)", "لأنها تقارن الحي بأحياء أخرى متفوقة عليه", "لأنها تعكس المشاعر الداخلية غير المصرح بها"], "answers": ["لأنها ترصد تحول الشعور بالحاجة إلى سلوك فعلي (طلب الخدمة)"]}, {"n": 30, "day": "اليوم الثاني", "topic": "Discover – شجرة المشكلة", "q": "عند استخدام شجرة المشكلة لتحليل 'ضعف الإنتاجية الزراعية'، وجد الفريق أن 'ملوحة التربة' أدت إلى 'موت المحاصيل' مما أدى لـ 'فقر المزارعين'. كيف نصنف 'فقر المزارعين' في هيكل الشجرة؟", "options": ["سبب ng)", "مرحلة النمذجة (Prototyping)"], "answers": ["التفكير التقاربي (Convergence)"]}, {"n": 34, "day": "اليوم الثالث", "topic": "Define – AAA", "q": "يعمل فريق على حل مشكلة \"الزحام المروري أمام المدارس\" ووجدوا أن الحل الجذري يتطلب \"تغيير اتجاه الشوارع\"، وهو قرار تملكه حصريًا إدارة المرور ولا يملك الفريق أي صلاحية قانونية للقيام به. لذلك، قرروا بدلًا من ذلك إعادة صياغة نطاق المشكلة للتركيز على \"تنظيم مواعيد خروج الطالب\" بالتنسيق مع المدرسة. أي معيار من أداة (AAA) استند إليه الفريق لتغيير النطاق؟", "options": ["معيار القدرة المادية (Ability)", "معيار القبول الاجتماعي (Acceptance)", "معيار السلطة والنفوذ (Authority)", "معيار القدرة على التكيف (Adaptability)"], "answers": ["معيار السلطة والنفوذ (Authority)"]}, {"n": 35, "day": "اليوم الثالث", "topic": "Define – SPICE", "q": "في ورشة عمل، صاغ أحد أعضاء الفريق المشكلة كالتالي: \"يعاني الشباب في الحي من الفراغ الذي يسبب لهم القلق النفسي\". طالبه أحد المستشارين بإضافة عنصر (Evidence) من نموذج (SPICE) لجعل البيان أكثر مهنية في مرحلة التحديد. أي من الجمل التالية تمثل الإضافة الصحيحة لهذا العنصر؟", "options": ["\"بناءً على مسح ميداني، تبين أن %65 من شباب الحي يقضون 8 ساعات بلا هدف\"", "\"نحن نحتاج إلى بناء نادٍ رياضي متكامل للشباب في الحي\"", "\"يجب على الأمانة التدخل فورًا لحل هذه الأزمة الاجتماعية\"", "\"القلق النفسي هو شعور سلبي يؤثر على الإنتاجية العامة\""], "answers": ["\"بناءً على مسح ميداني، تبين أن %65 من شباب الحي يقضون 8 ساعات بلا هدف\""]}, {"n": 36, "day": "اليوم الثالث", "topic": "Define – SPICE / Impact", "q": "يعمل فريق على صياغة مشكلة \"ضعف المهارات الرقمية لدى المعلمين\". عند كتابة عنصر (Impact) في بيان المشكلة، ما هو التركيز الذي يجب أن يظهر في الجملة ليعبر عن هذا العنصر بدقة؟", "options": ["وصف عدد المعلمين الذين لا يملكون أجهزة حاسب آلي", "وصف النتائج السلبية المستمرة (مثل: تدهور جودة التعليم للطلاب وفقدان التنافسية)", "وصف الطريقة التي سيتم بها تدريب المعلمين", "ذكر أسماء الشركات التي ستقدم الدعم التقني"], "answers": ["وصف النتائج السلبية المستمرة (مثل: تدهور جودة التعليم للطلاب وفقدان التنافسية)"]}, {"n": 37, "day": "اليوم الثالث", "topic": "Define – AAA", "q": "خلال ورشة عمل في مرحلة التحديد لتصفية شجرة المشكلة واختيار نطاق التدخل، قام الفريق بتقييم معيار \"القدرة\" (Ability) لأحد الأسباب الرئيسية وصوّتوا بالإيجاب بناءً على تقديراتهم الشخصية. رفض قائد الورشة الاعتماد على هذا التصويت، ووجّه الفريق لجمع بيانات موضوعية عبر مراجعة المراجع الثانوية، إجراء مقارنات مرجعية، وعقد اجتماعات مع خبراء لتقييم القدرة التنفيذية والمالية بدقة قبل اتخاذ قرار الإبقاء على هذا السبب أو حذفه. ما هو المبدأ الذي طبقه القائد؟", "options": ["مبدأ الاعتماد على البراهين (Evidence-Based Principle)", "مبدأ التصميم المنظومي المتمحور حول الإنسان (Human-Centered Systems Design)", "مبدأ التشاركية في الإبداع (Co-Creation Principle)", "مبدأ التركيز على الأثر (Impact-Driven Principle)"], "answers": ["مبدأ الاعتماد على البراهين (Evidence-Based Principle)"]}, {"n": 38, "day": "اليوم الثالث", "topic": "Define – السياق المنظومي", "q": "أثناء نشاط \"بناء شجرة المشكلة النهائية\"، نجح الفريق في تحديد نطاق التدخل بدقة واستبعدوا الأسباب المتعلقة بـ \"البيروقراطية المؤسسية\" لعدم امتلاكهم سلطة عليها (Authority). ومع ذلك، وجّه القائد بوضع هذه الأسباب المستبعدة في \"قائمة المخاطر والسياق\" المرافقة للشجرة، محذرًا من أن إغفالها عند تصميم الحل سيجعل الابتكار الاجتماعي معزولًا عن الواقع الذي يعيشه المستفيد. ما هو المبدأ الذي ما هو المبدأ الذي طبقه القائد؟", "options": ["مبدأ الاعتماد على البراهين (Evidence-Based Principle)", "مبدأ التصميم المنظومي المتمحور حول الإنسان (Human-Centered Systems Design)", "مبدأ التشاركية في الإبداع (Co-Creation Principle)", "مبدأ التركيز على الأثر (Impact-Driven Principle)"], "answers": ["مبدأ التصميم المنظومي المتمحور حول الإنسان (Human-Centered Systems Design)"]}, {"n": 39, "day": "اليوم الثالث", "topic": "Define – شجرة المشكلة النهائية", "q": "أثناء العمل على \"شجرة المشكلة النهائية\"، سأل أحد الأعضاء: \"لماذا نعيد بناء الشجرة وقد رسمناها سابقًا في مرحلة الاستكشاف؟\". أي من الإجابات التالية توضح الفرق المنهجي الصحيح؟ (اختر كل ما ينطبق)", "options": ["الشجرة هنا تقاربية تهدف لتنق const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm=s=>(s||'').trim().replace(/^[A-D][\.\)\-]\s*/i,'').replace(/^[أ-د][\)\.\-]\s*/,'').replace(/\s+/g,' ');
const dayQs=d=>QUESTIONS.filter(q=>q.day===d);
const makeCode=()=>String(Math.floor(100000+Math.random()*900000));
const app=$('#app');

let role=null, sessionRef=null, state=null, players={}, playerId=null, playerName='';
let timerHandle=null, selected=new Set(), submitted=false, participantStart=0, resultRef=null, grading=false;

function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function brandHeader(sub=''){return `<div class="brand"><div class="sipcBadge">SIPC</div><div><div class="brandTitle">الممارس المعتمد في الابتكار الاجتماعي</div><div class="brandSub">${esc(sub)}</div></div>${LOGOS}</div>`}
function sortedPlayers(){return Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)||(b[1].correct||0)-(a[1].correct||0))}
function currentQ(){return state ? dayQs(state.day)[state.idx] : null}
function answerStats(){
  const q=currentQ(), arr=Object.values(players), total=arr.length;
  const answered=q?arr.filter(p=>p.answers&&p.answers[q.n]).length:0;
  return {total,answered,remaining:Math.max(0,total-answered),pct:total?Math.round(answered/total*100):0};
}
function saveHostCode(code){localStorage.setItem('sipcHostCode',code)}
function clearTimers(){clearInterval(timerHandle);timerHandle=null}
function showHome(){
  clearTimers(); role=null;
  app.innerHTML=`<div class="home"><div class="homeInner">
    <div class="hero">${brandHeader('مسابقة الدورة التفاعلية')}<h1>اختبر معرفتك. ابنِ تقدّمك.</h1><p>تجربة تنافسية مباشرة، مصممة للدورة على الجوال وشاشة العرض.</p></div>
    <div class="roleGrid">
      <button class="roleCard" onclick="openHost()"><div class="roleIcon">▣</div><h3>شاشة المدرب</h3><p>إنشاء الجلسة، عرض الأسئلة وإدارة الترتيب.</p><span class="pill">بدء الجلسة</span></button>
      <button class="roleCard" onclick="showJoin()"><div class="roleIcon">◉</div><h3>دخول المشارك</h3><p>أدخل اسمك ورمز الجلسة وابدأ المنافسة.</p><span class="pill">دخول من الجوال</span></button>
    </div>
  </div></div>`;

async function openHost(){
  role='host';
  let code=localStorage.getItem('sipcHostCode');
  if(!code) code=makeCode();
  sessionRef=db.ref('sessions/'+code);
  let snap=await sessionRef.once('value');
  if(!snap.exists()){
    state={code,day:DAYS[0],idx:0,phase:'lobby',endsAt:null};
    await sessionRef.set({state,createdAt:firebase.database.ServerValue.TIMESTAMP,players:{},answers:{},results:{}});
  } else {
    state=snap.val().state||{code,day:DAYS[0],idx:0,phase:'lobby'};
    if(!state.code) state.code=code;
    if(!DAYS.includes(state.day)) state.day=DAYS[0];
    if(!['lobby','ready','question','results','final'].includes(state.phase)) state.phase='lobby';
    await sessionRef.child('state').set(state);
  }
  saveHostCode(code);
  sessionRef.child('state').on('value',s=>{if(role!=='host')return;state=s.val()||state;renderHost()});
  sessionRef.child('players').on('value',s=>{players=s.val()||{};renderHostLight();checkAllAnswered()});
  sessionRef.child('answers').on('child_added',s=>gradeAnswer(s.key,s.val()));
  renderHost();
}

function renderHost(){
  if(role!=='host'||!state)return;
  clearTimers();
  if(state.phase==='lobby') return renderLobby();
  if(state.phase==='ready') return renderReady();
  if(state.phase==='question') return renderQuestion();
  if(state.phase==='results') return renderResults();
  if(state.phase==='final') return renderFinal();
}

function renderQuestion(){
  const q=currentQ(), qs=dayQs(state.day), st=answerStats();
  const left=Math.max(0,Math.ceil(((state.endsAt||Date.now())-Date.now())/1000));
  app.innerHTML=`<div class="shell">
    <div class="header hostChrome">${brandHeader(`${state.day} · السؤال ${state.idx+1} من ${qs.length}`)}<button class="btn" onclick="toggleDisplay()">وضع العرض</button></div>
    <div class="questionLayout">
      <section class="card questionCard">
        <div class="questionTop"><span class="pill">${esc(q.topic)}</span><div class="timer" id="timer" style="--pct:${left/40*100}%"><b id="timerText">${left}</b></div></div>
        <div class="questionText">${esc(q.q)}</div>
        <div class="optionsGrid">${q.options.map((o,i)=>`<div class="option"><span class="shape ${['a','b','c','d','a'][i]}"><span>${String.fromCharCode(65+i)}</span></span><span>${esc(o)}</span></div>`).join('')}</div>
      </section>
      <aside class="sidePanel">
        <div class="card kpi"><b id="answeredKpi">${st.answered}</b><span>أجابوا</span><div class="progress" style="--progress:${st.pct}%"><i></i></div></div>
        <div class="card kpi"><b id="remainingKpi">${st.remaining}</b><span>متبقون</span></div>
        <div class="card kpi"><b id="totalKpi">${st.total}</b><span>إجمالي المشاركين</span></div>
        <div class="card hostActions hostChrome"><button class="btn orange" onclick="closeQuestion('manual')">إنهاء السؤال الآن</button><span class="small">إذا أجاب الجميع أو انتهى الوقت، ينتقل تلقائيًا للنتائج.</span></div>
      </aside>
    </div>
  </div>`;
  startHostTimer();
}

function renderResults(){
  const q=currentQ(), list=sortedPlayers(), st=answerStats(), qs=dayQs(state.day);
  const top=list.slice(0,10);
  const scores=top.map(x=>x[1].score||0);
  const max=Math.max(1,...scores), min=Math.min(...scores,0);
  const span=Math.max(1,max-min);
  const tower=top.map(([id,p],i)=>{
    const h=35+((p.score||0)-min)/span*65;
    return `<div class="towerCol"><div class="tower" style="--h:${h}%"></div><div class="towerScore">${(p.score||0).toLocaleString('ar-SA')}</div><div class="towerName">${i+1}. ${esc(p.name)}</div></div>`;
  }).join('');
  app.innerHTML=`<div class="shell">
    <div class="header hostChrome">${brandHeader(`${state.day} · نتيجة السؤال ${state.idx+1}`)}<button class="btn" onclick="toggleDisplay()">وضع العرض</button></div>
    <section class="card resultCard">
      <div class="resultHeader"><div><h2>لوحة الترتيب</h2><div class="small">${st.answered} من ${st.total} أجابوا</div></div><span class="pill">أفضل 10</span></div>
      <div class="correctBox"><b>الإجابة الصحيحة:</b> ${q.answers.map(esc).join(' · ')}</div>
      <div class="towerStage">${tower||'<div class="small" style="margin:auto">لا يوجد مشاركون بعد</div>'}</div>
      <div class="ranking">${list.slice(0,30).map(([id,p],i)=>`<div class="rankRow ${i<3?'top':''}"><div class="rankNum">${i+1}</div><div><b>${esc(p.name)}</b><div class="rankMeta">${p.correct||0} إجابة صحيحة</div></div><div class="rankPts">${(p.score||0).toLocaleString('ar-SA')}</div></div>`).join('')}</div>
      <div class="bottomBar hostChrome"><span class="small">المدرب يتحكم بالانتقال مثل كاهوت.</span>${state.idx>=qs.length-1?'<button class="btn green" onclick="finishCompetition()">إظهار النتيجة النهائية</button>':'<button class="btn primary" onclick="nextQuestion()">السؤال التالي</button>'}</div>
    </section>
  </div>`;
}

function renderHostLight(){
  if(role!=='host'||!state)return;
  if(state.phase==='lobby'){
    const list=sortedPlayers(), c=$('#joinCount'), cloud=$('#nameCloud');
    if(c)c.textContent=list.length;
    if(cloud)cloud.innerHTML=list.slice(0,30).map(([id,p])=>`<span class="nameChip">${esc(p.name)}</span>`).join('');
  }
  if(state.phase==='question'){
    const st=answerStats();
    if($('#answeredKpi'))$('#answeredKpi').textContent=st.answered;
    if($('#remainingKpi'))$('#remainingKpi').textContent=st.remaining;
    if($('#totalKpi'))$('#totalKpi').textContent=st.total;
    const pr=$('.progress');if(pr)pr.style.setProperty('--progress',st.pct+'%');
  }
}

function drawQR(){
  const e=$('#qr');if(!e)return;e.innerHTML='';
  new QRCode(e,{text:location.origin+location.pathname+'?join='+state.code,width:210,height:210});
}
function toggleDisplay(){document.body.classList.toggle('display');if(document.body.classList.contains('display'))document.documentElement.requestFullscreen?.().catch(()=>{})}

async function prepareCompetition(){
  state.idx=0;state.phase='ready';state.endsAt=null;
  await sessionRef.child('state').set(state);
}
async function startQuestion(){
  state.phase='question';state.endsAt=Date.now()+40000;state.startedAt=Date.now();
  await sessionRef.child('state').set(state);
}
function startHostTimer(){
  clearTimers();
  const tick=()=>{
    const left=Math.max(0,Math.ceil(((state.endsAt||Date.now())-Date.now())/1000));
    const t=$('#timerText'), ring=$('#timer'); if(t)t.textContent=left;if(ring)ring.style.setProperty('--pct',(left/40*100)+'%');
    if(left<=0){clearTimers();closeQuestion('timeout')}
  };
  tick();timerHandle=setInterval(tick,250);
}
async function closeQuestion(reason='manual'){
  if(!state||state.phase!=='question'||grading)return;
  grading=true;clearTimers();
  await new Promise(r=>setTimeout(r,180));
  state.phase='results';state.endsAt=null;state.closeReason=reason;
  await sessionRef.child('state').set(state);grading=false;
}
function checkAllAnswered(){
  if(role!=='host'||!state||state.phase!=='question'||grading)return;
  const st=answerStats(); if(st.total>0&&st.answered>=st.total) closeQuestion('all');
}
async function nextQuestion(){
  const qs=dayQs(state.day);
  if(state.idx>=qs.length-1)return finishCompetition();
  state.idx++;state.phase='ready';state.endsAt=null;
  await sessionRef.child('state').set(state);
}
async function finishCompetition(){state.phase='final';state.endsAt=null;await sessionRef.child('state').set(state)}
async function backLobby(){state.phase='lobby';state.endsAt=null;await sessionRef.child('state').set(state)}
async function changeDay(day){state.day=day;state.idx=0;state.phase='lobby';state.endsAt=null;await sessionRef.child('state').set(state)}
async function nextDay(){
  const i=Math.min(DAYS.indexOf(state.day)+1,DAYS.length-1);
  state.day=DAYS[i];state.idx=0;state.phase='lobby';state.endsAt=null;await sessionRef.child('state').set(state);
}
async function newSession(){
  if(!confirm('إنشاء جلسة جديدة؟ سيبقى ترتيب الجلسة الحالية محفوظًا في Firebase.'))return;
  if(sessionRef)sessionRef.off();
  const code=makeCode();saveHostCode(code);sessionRef=db.ref('sessions/'+code);
  state={code,day:DAYS[0],idx:0,phase:'lobby',endsAt:null};players={};
  await sessionRef.set({state,createdAt:firebase.database.ServerValue.TIMESTAMP,players:{},answers:{},results:{}});
  sessionRef.child('state').on('value',s=>{if(role!=='host')return;state=s.val()||state;renderHost()});
  sessionRef.child('players').on('value',s=>{players=s.val()||{};renderHostLight();checkAllAnswered()});
  sessionRef.child('answers').on('child_added',s=>gradeAnswer(s.key,s.val()));
}

async function gradeAnswer(key,a){
  if(!a||a.graded)return;
  const stSnap=await sessionRef.child('state').once('value'), st=stSnap.val();
  if(!st||st.phase!=='question'){await sessionRef.child('answers/'+key+'/graded').set(true);return}
  const q=dayQs(st.day)[st.idx]; if(!q||q.n!==a.qn)return;
  const pSnap=await sessionRef.child('players/'+a.pid).once('value'), p=pSnap.val();
  if(!p||p.answers?.[q.n]){await sessionRef.child('answers/'+key+'/graded').set(true);return}
  const correctSet=new Set(q.answers.map(norm)), pickedSet=new Set((a.picks||[]).map(i=>norm(q.options[i])));
  const ok=correctSet.size===pickedSet.size&&[...correctSet].every(x=>pickedSet.has(x));
  const elapsed=Math.min(40000,Math.max(0,a.elapsed||40000));
  const points=ok?1000+Math.round(500*(1-elapsed/40000)):0;
  const updates={};
  updates[`players/${a.pid}/answers/${q.n}`]={ok,points};
  updates[`players/${a.pid}/score`]=(p.score||0)+points;
  updates[`players/${a.pid}/correct`]=(p.correct||0)+(ok?1:0);
  updates[`results/${a.pid}/${q.n}`]={ok,points,total:(p.score||0)+points};
  updates[`answers/${key}/graded`]=true;
  await sessionRef.update(updates);
}

/* Participant */
function showJoin(){
  const preset=new URLSearchParams(location.search).get('join')||'';
  app.innerHTML=`<div class="participant"><div class="header">${brandHeader('دخول المشارك')}</div><div class="card" style="padding:24px">
    <label class="small">الاسم</label><input id="pname" class="input" placeholder="اكتب اسمك">
    <div style="height:10px"></div><label class="small">رمز الجلسة</label><input id="pcode" class="input" inputmode="numeric" value="${esc(preset)}" placeholder="مثال: 123456">
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="joinSession()">دخول المسابقة</button>
  </div></div>`;
}
async function joinSession(){
  playerName=$('#pname').value.trim();const code=$('#pcode').value.trim();
  if(!playerName||code.length<4)return toast('اكتب الاسم ورمز الجلسة');
  participantWait('جاري الاتصال','لحظات ويتم إدخالك إلى الجلسة…');
  role='participant';sessionRef=db.ref('sessions/'+code);
  const s=await sessionRef.once('value');if(!s.exists())return participantError();
  playerId=localStorage.getItem('sipcPid-'+code)||db.ref().push().key;
  localStorage.setItem('sipcPid-'+code,playerId);
  await sessionRef.child('players/'+playerId).transaction(p=>p?{...p,name:playerName}:{name:playerName,score:0,correct:0,answers:{}});
  sessionRef.child('state').on('value',snap=>participantState(snap.val()));
}
function participantState(st){
  clearTimers(); if(!st)return participantError(); state=st;
  if(st.phase==='lobby')return participantWait('تم تسجيلك','بانتظار المدرب لبدء المسابقة…');
  if(st.phase==='ready')return participantWait(`السؤال ${st.idx+1} قريبًا`,'استعد…');
  if(st.phase==='question')return renderParticipantQuestion();
  if(st.phase==='results')return renderParticipantResult(false);
  if(st.phase==='final')return renderParticipantResult(true);
}
function participantWait(title,sub){app.innerHTML=`<div class="participant"><div class="header">${brandHeader('المشارك')}</div><div class="card wait"><div class="pulse"></div><h2>${esc(title)}</h2><div class="small">${esc(sub)}</div></div></div>`}
function participantError(){app.innerHTML=`<div class="participant"><div class="card wait"><h2>تعذر الاتصال بالجلسة</h2><p class="small">تأكد من رمز الجلسة وحاول مرة أخرى.</p><button class="btn primary" onclick="showJoin()">إعادة المحاولة</button></div></div>`}
function renderParticipantQuestion(){
  const q=currentQ();selected=new Set();submitted=false;participantStart=performance.now();
  app.innerHTML=`<div class="participant">
    <div class="mobileHead"><span class="pill">${state.day} · سؤال ${state.idx+1}</span><span class="pill">⏱ <b id="pTimer">40</b> ث</span></div>
    <div class="card mobileQuestion"><h2>${esc(q.q)}</h2>
      ${q.options.map((o,i)=>`<label id="mo${i}" class="mobileOption"><input type="${q.answers.length>1?'checkbox':'radio'}" name="ans" onchange="pickOption(${i},${q.answers.length>1})"><span class="shape ${['a','b','c','d','a'][i]}" style="background:${['#d94f45','#3e83c5','#d5a52d','#4f9c58','#7356a8'][i]};color:#fff"><span>${String.fromCharCode(65+i)}</span></span><span>${esc(o)}</span></label>`).join('')}
      <button id="submitBtn" class="btn primary mobileSubmit" onclick="submitParticipantAnswer()">اعتماد الإجابة</button>
      <div id="submitMsg" class="small" style="text-align:center;margin-top:10px"></div>
    </div></div>`;
  startParticipantTimer();
}
function pickOption(i,multi){
  if(submitted)return;
  if(!multi){selected.clear();$$('.mobileOption').forEach(x=>x.classList.remove('sel'));selected.add(i);$('#mo'+i).classList.add('sel')}
  else{selected.has(i)?selected.delete(i):selected.add(i);$('#mo'+i).classList.toggle('sel')}
}
function startParticipantTimer(){
  clearTimers();
  const tick=()=>{
    const left=Math.max(0,Math.ceil(((state.endsAt||Date.now())-Date.now())/1000));
    if($('#pTimer'))$('#pTimer').textContent=left;
    if(left<=0){clearTimers();if($('#submitBtn'))$('#submitBtn').disabled=true}
  };
  tick();timerHandle=setInterval(tick,250);
}
async function submitParticipantAnswer(){
  if(submitted||!selected.size)return toast('اختر إجابتك أولًا');
  submitted=true;$('#submitBtn').disabled=true;$('#submitMsg').textContent='تم استلام إجابتك ✓';
  const q=currentQ(), elapsed=Math.min(40000,Math.round(performance.now()-participantStart));
  await sessionRef.child('answers').push({pid:playerId,name:playerName,qn:q.n,picks:[...selected],elapsed,sentAt:firebase.database.ServerValue.TIMESTAMP,graded:false});
}
async function renderParticipantResult(final=false){
  const pSnap=await sessionRef.child('players').once('value'), all=pSnap.val()||{};
  const list=Object.entries(all).sort((a,b)=>(b[1].score||0)-(a[1].score||0)||(b[1].correct||0)-(a[1].correct||0));
  const rank=Math.max(1,list.findIndex(([id])=>id===playerId)+1), me=all[playerId]||{score:0,correct:0};
  const q=currentQ();
  let res=null;if(q){const r=await sessionRef.child(`results/${playerId}/${q.n}`).once('value');res=r.val()}
  app.innerHTML=`<div class="participant"><div class="header">${brandHeader(final?'النتيجة النهائية':'نتيجة السؤال')}</div>
    <div class="card personalResult">
      ${!final?`<div class="pill" style="margin-bottom:16px">${res?.ok?'إجابة صحيحة ✓':'إجابة غير صحيحة'}</div>`:''}
      <div class="small">${final?'ترتيبك النهائي':'ترتيبك الحالي'}</div><div class="bigRank">#${rank}</div>
      <div class="bigScore">${(me.score||0).toLocaleString('ar-SA')} نقطة</div>
      <div class="small">${me.correct||0} إجابة صحيحة · من أصل ${list.length} مشارك</div>
      ${!final?`<div style="margin-top:12px"><b>${res?.points?`+${res.points} نقطة`:'0 نقطة'}</b></div>`:''}
      <div class="personalList"><b>أفضل 5</b><div style="margin-top:9px">${list.slice(0,5).map(([id,p],i)=>`<div class="rankRow ${id===playerId?'top':''}"><div class="rankNum">${i+1}</div><div><b>${esc(p.name)}</b></div><div class="rankPts">${(p.score||0).toLocaleString('ar-SA')}</div></div>`).join('')}</div></div>
      <div class="pill" style="margin-top:18px">${final?'انتهت المسابقة':'بانتظار المدرب للسؤال التالي…'}</div>
    </div></div>`;
}

if(new URLSearchParams(location.search).get('join')) showJoin(); else showHome();
</script>
</body></html>
